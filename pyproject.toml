[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riima"
dynamic = ["version", "dependencies"]
description = "Tools for expert-led digital petrography and optical affinity mapping"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Lucas Marques Barros"}]
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
]

[project.scripts]
riima = "riima.gui:main"

[project.gui-scripts]
riima-gui = "riima.gui:gui"

[tool.setuptools]
packages = ["riima"]
include-package-data = false
license-files = ["LICENSE", "THIRD_PARTY.md"]

[tool.setuptools.dynamic]
version = {attr = "riima.__version__"}
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
riima = ["templates/*.html", "assets/branding/*.png", "assets/branding/*.ico"]
