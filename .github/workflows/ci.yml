name: RIIMA verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  MPLBACKEND: Agg
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'

jobs:
  headless:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements/dev.txt
      - run: python -B -m pytest tests -q -p no:cacheprovider --basetemp="${{ runner.temp }}/riima-tests" --ignore=tests/test_riima_gui.py

  gui:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - run: python -m pip install -r requirements/dev.txt
      - if: runner.os == 'Linux'
        run: xvfb-run -a python -B -m pytest tests/test_riima_gui.py -q -p no:cacheprovider --basetemp="${{ runner.temp }}/riima-gui-tests"
      - if: runner.os == 'Windows'
        run: python -B -m pytest tests/test_riima_gui.py -q -p no:cacheprovider --basetemp="${{ runner.temp }}/riima-gui-tests"

  distribution:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - run: python -m pip install build twine
      - run: python -B scripts/build_share.py --output "${{ runner.temp }}/RIIMA.zip"
      - run: python -c "import zipfile; zipfile.ZipFile(r'${{ runner.temp }}/RIIMA.zip').extractall(r'${{ runner.temp }}/riima-build')"
      - run: python -m build --sdist --wheel --outdir "${{ runner.temp }}/riima-artifacts"
        working-directory: ${{ runner.temp }}/riima-build/RIIMA
      - run: python -m twine check "${{ runner.temp }}"/riima-artifacts/*
      - name: Install independent artifacts, export report, test extracted sources
        run: xvfb-run -a python -B scripts/verify_distribution.py --artifacts "${{ runner.temp }}/riima-artifacts" --work "${{ runner.temp }}/riima-distribution-${{ matrix.python }}"
      - uses: actions/upload-artifact@v4
        with:
          name: riima-distribution-${{ matrix.python }}
          path: ${{ runner.temp }}/riima-artifacts/*
